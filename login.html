<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login form</title>
    <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>
</head>
<body class="bg-green-500 min-h-screen flex justify-center items-center">
    <form action="">
        <div class="bg-white p-7 rounded-lg shadow-xl gh auth logout
        gh a">
            <h1 class="text-center text-xl font-bold text-green-500">Login Form Portal</h1>
                <div class="mt-3">
                    <label for="" class="block font-bold text-green-500">Username</label>
                    <input type="text" placeholder="Username" class="bg-gray-200 w-full p-3 rounded-lg outline-green-500 outline-lg">
                </div>
                  <div class="mt-2">
                    <label for="" class="block font-bold text-green-500">Email</label>
                    <input type="email" placeholder="Email" class="bg-gray-200 w-full p-3 rounded-lg outline-green-500 outline-lg">
                </div>
               <div class="mt-2">
                    <label for="" class="block font-bold text-green-500">Phone Number</label>
                    <input type="text" placeholder="Phone Number" class="bg-gray-200 w-full p-3 rounded-lg outline-green-500 outline-lg">
                </div>
                  <div class="mt-2">
                    <label for="" class="block font-bold text-green-500">Password</label>
                    <input type="password" placeholder="Password" class="bg-gray-200 w-full p-3 rounded-lg outline-green-500 outline-lg">
                </div>
                <button class="bg-green-400 w-full p-3 mt-4 text-white font-bold">Login</button>
                <div class="flex space-x-3 mt-3">
                    <p>Dont you have account ?</p>
                    <a href="" class="text-green-500">Register</a>
                </div>
        </div>
    </form>
</body>
</html>
