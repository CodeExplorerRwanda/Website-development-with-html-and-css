<!DOCTYPE html>
<html lang="en">
<head>

    <title>Code Explorer Rwanda</title>
    <script src="https://cdn.tailwindcss.com"></script>  
</head>
<body>
    <div class="bg-white">
        <div class="flex justify-between max-w-7xl mx-auto shadow-lg p-4">
            <div class="p-2">
                 <a href="" class="flex space-x-3">
                    <p class="bg-gradient-to-bl from-blue-500 to-indigo-500 p-2 rounded-xl text-white"><svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" class="lucide lucide-code"><path d="m16 18 6-6-6-6"/><path d="m8 6-6 6 6 6"/></svg></p>
                    <p class="mt-2 font-bold ">Code Explorer <span class="text-blue-500">Rwanda</span></p>
                 </a>
            </div>
            <div class="flex space-x-4 mt-3">
                <a href="#" class="hover:text-blue-500 transition-colors">Home</a>
                <a href="#" class="hover:text-blue-500 transition-colors">About</a>
                <a href="#" class="hover:text-blue-500 transition-colors">Services</a>
                <a href="#" class="hover:text-blue-500 transition-colors">Insights</a>
                <a href="#" class="hover:text-blue-500 transition-colors">Portifolio</a>
                <a href="#" class="hover:text-blue-500 transition-colors">Contact</a>
            </div>
            <div class="mt-3">
                <button class="bg-blue-500 p-2 rounded-xl inline-flex text-white font-bold">Get Started <svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" class="lucide lucide-arrow-right"><path d="M5 12h14"/><path d="m12 5 7 7-7 7"/></svg></button>
            </div>
        </div>

        <div class="mt-20 mx-auto max-w-3xl">
            <h1 class="text-gray-800 font-bold text-7xl">Build <span class="bg-gradient-to-bl from-blue-500 to-indigo-500 bg-clip-text text-transparent">Modern</span> digital <span class="ms-28">experiences</span></h1>
            <p class="text-gray-700 text-xl mt-4">Code Explorer Rwanda helps startups and enterprises craft beautiful, <span class="ms-28">high‑performance web applications</span>.</p>

            <div class="ms-48 mt-5 flex space-x-3">
                <button class="bg-gradient-to-bl from-blue-500 to-indigo-500 p-2 px-3 py-3 rounded-lg text-white font-bold">Start a project</button>
                <button class="font-bold text-gray-700 py-3 px-3 border-2 rounded-lg">View Portifolio</button>
            </div>
        </div>
    </div>

</html>
